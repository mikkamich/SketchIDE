name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # Крок 1: Якщо файлу gradlew немає, цей крок створить його автоматично
    - name: Ensure Gradle Wrapper exists
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi

    # Крок 2: Надаємо файлу права на запуск у Linux
    - name: Change permissions for gradlew
      run: chmod +x gradlew

    # Крок 3: Запуск збірки
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Крок 4: Збереження готового APK, щоб його можна було завантажити
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
